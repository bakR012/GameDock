name: Publish Windows releases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gamedock-releases
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GameDock
        shell: cmd
        run: GameDock\Build-Release.cmd
      - name: Upload new versions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = gh release list --limit 1000 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE) { throw 'Cannot list releases' }
          $current = (Get-Item GameDock-Setup.exe).VersionInfo.FileVersion
          foreach ($file in Get-ChildItem Releases/GameDock-Setup-*.exe | Sort-Object Name) {
            $version = [version]$file.VersionInfo.FileVersion
            $tag = 'v' + $version.ToString(3)
            if ($existing -contains $tag) { continue }
            $latest = if ($version -eq [version]$current) { 'true' } else { 'false' }
            gh release create $tag $file.FullName --target $env:GITHUB_SHA --title "GameDock $tag" --notes "Windows installer for GameDock $tag." --latest=$latest
            if ($LASTEXITCODE) { throw "Publishing $tag failed" }
          }
